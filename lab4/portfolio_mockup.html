<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Mockup</title>
    <link rel="stylesheet" href="portfolio_mockup.css">
</head>
<body>
<!-- Header -->
<header>
    <h1>Header</h1>
    <nav>
        <a>Home</a>
        <a>Resume</a>
        <a>Projects</a>
        <a>Contact</a>
    </nav>
</header>

<!-- Home -->
<section id="home" class="section light-bg">
    <h2>Home</h2>
</section>

<!-- Resume -->
<section id="resume" class="section">
    <h2>Resume</h2>
</section>

<!-- Projects -->
<section id="projects" class="section light-bg">
    <h2>Projects</h2>
    <div class="project-grid">
        <div class="project-card">
            <h3>Project 1</h3>
        </div>
        <div class="project-card">
            <h3>Project 2</h3>
        </div>
    </div>
</section>

<!-- Contact -->
<section id="contact" class="section">
    <h2>Contact</h2>
</section>

<!-- Footer -->
<footer>
    <h2>Footer</h2>
</footer>
</body>
</html>
